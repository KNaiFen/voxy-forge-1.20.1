name: Sync and release Voxy Forge 1.20.1

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [multiversion]
    paths:
      - .github/workflows/build-forge-1201.yml
      - build.forge.gradle.kts

permissions:
  contents: write

concurrency:
  group: voxy-forge-1201-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multiversion
          fetch-depth: 0
      - name: Merge upstream multiversion
        id: upstream
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/m3t4f1v3/voxy.git
          git fetch upstream multiversion
          upstream_sha=$(git rev-parse FETCH_HEAD)
          previous=$(git rev-parse HEAD)
          git merge --no-edit FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$previous" ]; then
            git push origin HEAD:multiversion
          fi
          tag="forge-1.20.1-win-linux-x64-upstream-${upstream_sha:0:12}"
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$existing" ]; then
            echo 'release_needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'release_needed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.upstream.outputs.release_needed == 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        if: steps.upstream.outputs.release_needed == 'true'
      - name: Build Forge 1.20.1
        if: steps.upstream.outputs.release_needed == 'true'
        run: ./gradlew :1.20.1-forge:build
      - name: Publish GitHub Release
        if: steps.upstream.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        shell: bash
        run: |
          shopt -s nullglob
          playable=(versions/1.20.1-forge/build/libs/voxy-*-legacyforge.jar)
          development=(versions/1.20.1-forge/build/devlibs/voxy-*-legacyforge.jar)
          test "${#playable[@]}" -eq 1
          test "${#development[@]}" -eq 1
          mkdir release
          cp "${playable[0]}" release/
          name=$(basename "${development[0]}")
          cp "${development[0]}" "release/${name%.jar}-dev.jar"
          (cd release && sha256sum *.jar > SHA256SUMS.txt)
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Voxy Forge 1.20.1 Windows/Linux x64 (upstream ${UPSTREAM_SHA:0:12})" \
            --notes "Automatically built from m3t4f1v3/voxy@${UPSTREAM_SHA} for Windows and Linux x86-64 only. This build has not been validated with Noxy. The -dev.jar is for compiling dependent mods; install the other JAR in Minecraft." \
            --prerelease
